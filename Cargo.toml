# ChickenWM: every program lives in its own repository and is checked out here as a git
# submodule (`git clone --recursive`). This workspace builds them all together. The patches make
# the members use the local chickenwm-core folder instead of the tagged
# GitHub copies, so a change to core is picked up straight away.
[workspace]
resolver = "2"
members = [
    "chickenwm-core",
    "chickenwm-rooster",
    "chickenwm-wm",
    "chickenwm-binds",
    "chickenwm-paper",
    "chickenwm-launcher",
    "chickenwm-files",
    "chickenwm-notify",
    "chickenwm-settings",
    "roobar",
    "chickenctl",
    "henbrowser",
    "chickenwm-shot",
]

[patch."https://github.com/despale-code/chickenwm-core"]
chickenwm-core = { path = "chickenwm-core" }

