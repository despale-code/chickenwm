[package]
name = "coop"
version = "0.2.1"
edition = "2024"
authors = ["ChickenWM Contributors"]
license = "MIT"
repository = "https://github.com/despale-code/chickenwm"

[dependencies]
chickenwm-core = { path = "../chickenwm-core" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = { version = "0.1" }
anyhow = { version = "1.0" }
thiserror = { version = "2.0" }
parking_lot = { version = "0.12" }
ash = "0.38"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Security",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11"
] }
